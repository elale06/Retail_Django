{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'CSS/estilo.css' %}">
    <title>Editar Servicio</title>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="nav">
        <a href="/">Menú</a>
        <a href="/informacion/">Información</a>
        <a href="/servicios/">Servicios</a>
        <a href="/servicios/login/">Login</a>
    </nav>
    <div class="page-shell">
    <div class="container card">
        <div class="card">
            <h2>Editar Servicio</h2>
            <form method="POST" class="edit-form">
                {% csrf_token %}
                <h3>Datos del Servicio</h3>

                <label>Nombre</label>
                <input type="text" name="nombre" placeholder="{{ servicio.nombre }}">

                <label>Descripción</label>
                <textarea name="descripcion" placeholder="{{ servicio.descripcion }}"></textarea>

                <label>Disponibilidad</label>
                <input type="text" name="disponibilidad" placeholder="{{ servicio.disponibilidad }}">

                <h3>Precio</h3>
                <label>Precio</label>
                <input type="number" name="precio" placeholder="{{ precio.precio }}">

                <label>Descuento</label>
                <input type="number" name="descuento" placeholder="{{ precio.descuento }}">

                <label>Moneda</label>
                <input type="text" name="moneda" placeholder="{{ precio.moneda }}">

                <label>Observación</label>
                <textarea name="observacion" placeholder="{{ precio.observacion }}"></textarea>

                <button type="submit">Actualizar Servicio</button>
            </form>
            <a class="back" href="/servicios/">Volver a Servicios</a>
        </div>
    </div>
    </div>
</body>
</html>
